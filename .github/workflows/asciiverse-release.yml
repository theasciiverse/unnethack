# Builds UnNetHack for the Asciiverse catalog: one archive per target,
# named unnethack-<target>.tar.gz, plus a SHA256SUMS file, attached to a
# GitHub release (hub/catalog/SCHEMA.md, release.source = "github"). Runs
# on a pushed tag, or by hand for an existing tag.
#
# Linux builds run in Alpine and link ncurses and Lua statically, so the
# binaries carry the -musl triple that av looks for first and need nothing
# on the player's machine. macOS links the system ncurses, which every Mac
# has, and a static Lua 5.4 built in the job from lua.org's tarball
# (sha256 pinned). No Windows build: the tty interface leans on a POSIX
# terminal, and UnNetHack's own Windows port is its PDCurses one.
#
# Upstream's CI (unnethack.yml) is theirs and is left as it is.

name: asciiverse-release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  LUA_VERSION: "5.4.8"
  LUA_SHA256: "4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae"

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base ncurses-dev ncurses-static flex bison \
              lua5.4 lua5.4-dev linux-headers &&
            LDFLAGS=-static LUA_INCLUDE=-I/usr/include/lua5.4 \
              LUA_LIB="-L/usr/lib/lua5.4 -llua" asciiverse/build.sh &&
            asciiverse/package.sh ${{ matrix.target }}'
          file out/unnethack

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Static Lua
        run: |
          curl -fsSLO --retry 5 --retry-all-errors --connect-timeout 20 "https://www.lua.org/ftp/lua-$LUA_VERSION.tar.gz"
          echo "$LUA_SHA256  lua-$LUA_VERSION.tar.gz" | shasum -a 256 -c
          tar -xzf "lua-$LUA_VERSION.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/lua-$LUA_VERSION" -j2 macosx \
            MYCFLAGS="-arch ${{ matrix.arch }}" MYLDFLAGS="-arch ${{ matrix.arch }}"
          echo "LUA_DIR=$RUNNER_TEMP/lua-$LUA_VERSION/src" >> "$GITHUB_ENV"

      - name: Build and package
        run: |
          LUA="$LUA_DIR/lua" LUA_INCLUDE="-I$LUA_DIR" LUA_LIB="$LUA_DIR/liblua.a" \
            CFLAGS="-O2 -arch ${{ matrix.arch }}" LDFLAGS="-arch ${{ matrix.arch }}" \
            asciiverse/build.sh
          file out/unnethack
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "UnNetHack $TAG" \
                 --notes "UnNetHack $TAG, tty and curses interfaces, built for the Asciiverse catalog: one archive per target."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
